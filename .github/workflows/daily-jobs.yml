name: Daily company job fetch

on:
  schedule:
    # ~06:00 IST
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch jobs from company ATS boards
        run: npm run scrape

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scraped-jobs.json
          if git diff --staged --quiet; then
            echo "No job changes"
          else
            git commit -m "chore: refresh scraped jobs from company portals"
            git push
          fi
